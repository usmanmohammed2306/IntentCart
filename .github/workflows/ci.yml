name: Verify IntentCart
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      EXTERNAL_CALL_LIMIT: "0"
      ASTRO_BUDGET_MICROUSD: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.lock.txt
      - run: python scripts/verify.py
      - run: python scripts/evaluate_lab.py --output /tmp/lab-evaluation.json
      - run: python scripts/evaluate.py --personas 20 --seed 2026 --output /tmp/evaluation.json
      - run: python scripts/evaluate_missions.py --output /tmp/missions-evaluation.json
      - run: python scripts/evaluate_agent.py --output /tmp/agent-evaluation.json
      - run: python scripts/evaluate_learned_acquisition.py --output /tmp/learned-evaluation.json
      - run: python scripts/evaluate_budget_roadmap.py --output /tmp/budget-roadmap.json
      - run: python scripts/evaluate_preference_workbench.py --output /tmp/preference-workbench.json
